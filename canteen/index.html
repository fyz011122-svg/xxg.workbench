<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a9714b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小小怪食堂">
<link rel="manifest" href="/canteen/manifest.webmanifest">
<link rel="apple-touch-icon" href="/canteen/icons/apple-touch-icon.png">
<link rel="icon" href="/canteen/icons/icon-192.png">
<title>小小怪食堂</title>
<link rel="stylesheet" href="/canteen/assets/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo">食</div>
        <div class="brand-text">
          <h1 id="pageTitle">小小怪食堂</h1>
          <p id="pageSub">选菜系 · 点好菜</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnOrders" title="我的订单">🧾</button>
        <button class="icon-btn" id="btnEdit" title="编辑菜单">✎</button>
        <button class="icon-btn" id="btnMenu" title="设置">⚙</button>
      </div>
    </div>
  </header>

  <main id="main"><div id="viewRoot"></div></main>

  <!-- 购物车悬浮条 -->
  <div id="cartBar" class="cart-bar hidden">
    <div class="cb-info" id="cartBarInfo">
      <span class="cb-count">0</span>
      <span class="cb-total">¥0</span>
    </div>
    <button class="cb-btn" id="btnOpenCart">查看购物车</button>
  </div>

  <nav id="tabbar">
    <button class="tab active" data-go="home"><span class="tab-ico">🏠</span><span class="tab-txt">菜单</span></button>
    <button class="tab" data-go="orders"><span class="tab-ico">🧾</span><span class="tab-txt">订单</span></button>
    <button class="tab" data-go="manage"><span class="tab-ico">🗂️</span><span class="tab-txt">管理</span></button>
  </nav>

  <button id="fab" title="新增">+</button>
</div>

<div id="sheetMask" class="mask hidden">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h3 id="sheetTitle">标题</h3>
      <button class="close-btn" id="sheetClose">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/canteen/assets/db.js"></script>
<script src="/canteen/assets/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/canteen/sw.js').catch(function (e) { console.warn('SW 失败', e); });
  });
}
</script>
</body>
</html>
